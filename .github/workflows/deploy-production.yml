name: Deploy (Production)

# Build flavor `production`. Play Console menerima AAB sebagai draft di
# track closed testing (nama API: alpha).
# Build APK dan GitHub Release ditunda (langkahnya dikomentari).
# Rollout Play tetap manual. Track production belum dipakai.
# Trigger: push tag `vMAJOR.MINOR.PATCH` (contoh `v1.1.1`).
#
# versionName = tag tanpa awalan `v`.
# versionCode = 1 + versionCode tertinggi yang sudah ada di package Play
# yang sama (semua track, termasuk draft). Job build-and-release mengantri
# supaya dua tag tidak mengambil angka yang sama.
#
# Secrets GitHub (Settings → Secrets → Actions):
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   PLAY_STORE_SERVICE_ACCOUNT_JSON  - JSON service account Play Developer API
#     (lihat docs/env/google_play_console/credential.md)
#   HUAWEI_CLIENT_ID / HUAWEI_CLIENT_SECRET / HUAWEI_APP_ID - API client
#     AppGallery Connect. Kosong = langkah Huawei dilewati (skip, tidak fail).
#
# Host API: env.g.dart → https://api.sambasku.com

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FLAVOR: production
  FLUTTER_VERSION: "3.44.1"
  PLAY_PACKAGE_NAME: com.iamutaki.sambasku

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Reject tag that is not vMAJOR.MINOR.PATCH
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Test Play version-code resolver
        run: node --test scripts/next-play-version-code.test.mjs

      - name: Test Huawei AppGallery uploader
        run: node --test scripts/upload-huawei-appgallery.test.mjs

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: play-com.iamutaki.sambasku
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Resolve production version (tag + Play versionCode + 1)
        id: version
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          NAME="${GITHUB_REF_NAME#v}"
          N=$(node scripts/next-play-version-code.mjs)
          case "$N" in
            ''|*[!0-9]*) echo "invalid version code: '$N'" >&2; exit 1 ;;
          esac
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${N}"    >> "$GITHUB_OUTPUT"
          echo "Production version: ${NAME}+${N}"

      - name: Write resolved version into pubspec.yaml
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i "s|^version:.*|version: ${VERSION_NAME}+${VERSION_CODE}|" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build App Bundle (Play Console)
        run: >
          flutter build appbundle --release --obfuscate
          --split-debug-info=./debug-info
          --flavor "$FLAVOR" -t lib/main.dart

      # APK universal untuk unduh manual di web. Ditunda.
      # debug-info terpisah supaya simbol AAB tidak tertimpa.
      # - name: Build APK (sideload)
      #   run: >
      #     flutter build apk --release --obfuscate
      #     --split-debug-info=./debug-info-apk
      #     --flavor "$FLAVOR" -t lib/main.dart

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-aab
          path: build/app/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error

      # - name: Upload APK as workflow artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: production-apk
      #     path: build/app/outputs/flutter-apk/app-production-release.apk
      #     if-no-files-found: error

      # Draft di track closed testing (API: alpha) - tidak auto-publish.
      # Rollout tetap manual di Play Console.
      - name: Assert AAB has no advertising ID permission
        run: node scripts/assert-no-ad-id.mjs

      - name: Upload draft ke Google Play closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          tracks: alpha
          status: draft
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

      # Draft di AppGallery Connect. Submit review manual di AGC, konsisten
      # dengan Play (draft + rollout manual). Tanpa secrets Huawei, step ini
      # skip (exit 0) supaya workflow tidak fail.
      - name: Upload draft ke Huawei AppGallery
        env:
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        run: node scripts/upload-huawei-appgallery.mjs
          build/app/outputs/bundle/productionRelease/app-production-release.aab

      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v3
      #   with:
      #     tag_name: v${{ steps.version.outputs.name }}
      #     name: SambasKu v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
      #     generate_release_notes: true
      #     files: |
      #       build/app/outputs/bundle/productionRelease/app-production-release.aab
      #       build/app/outputs/flutter-apk/app-production-release.apk
      #     fail_on_unmatched_files: true
      #     make_latest: "true"

  notify:
    needs: [test, build-and-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/mobile — Deploy (Production)
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}
