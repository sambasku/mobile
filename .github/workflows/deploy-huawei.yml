name: Deploy (Huawei AppGallery)

# Catch-up / deploy ulang ke AppGallery Connect.
# Rilis normal: AAB yang sama di-upload dari Deploy (Production) setelah
# draft Play (lihat deploy-production.yml).
#
# Trigger: workflow_dispatch saja (bukan push tag) supaya tidak build ulang
# paralel saat rilis. Input tag kosong = tag vMAJOR.MINOR.PATCH terbaru.
# Workflow mengunduh artefact `production-aab` dari run Deploy (Production)
# yang sukses untuk tag itu, lalu upload draft ke AGC.
#
# Secrets: HUAWEI_CLIENT_ID / HUAWEI_CLIENT_SECRET / HUAWEI_APP_ID
# (KEYSTORE tidak perlu - tidak rebuild). Kosong = script skip exit 0.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag yang di-deploy (mis. v1.2.3). Kosong = tag terbaru."
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  huawei:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: huawei-appgallery
      cancel-in-progress: false
    steps:
      - name: Checkout (scripts + semua tag)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag (dispatch kosong = terbaru)
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(git tag --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag tidak ditemukan / tidak valid: '$TAG' (pola vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Catch-up Huawei dari tag: ${TAG}"

      - name: Test Huawei AppGallery uploader
        run: node --test scripts/upload-huawei-appgallery.test.mjs

      - name: Unduh production-aab dari Deploy (Production)
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list \
            --workflow deploy-production.yml \
            --branch "$TAG" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "Tidak ada run Deploy (Production) sukses untuk tag $TAG." >&2
            echo "Jalankan Deploy (Production) dulu, atau pastikan artefact production-aab masih ada." >&2
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Mengunduh production-aab dari run ${RUN_ID}"
          mkdir -p aab
          gh run download "$RUN_ID" -n production-aab -D aab
          AAB=$(find aab -type f -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo "Artefact production-aab kosong / tanpa file .aab" >&2
            find aab -type f -print >&2 || true
            exit 1
          fi
          echo "aab_path=${AAB}" >> "$GITHUB_OUTPUT"
          ls -la "$AAB"

      # Draft di AppGallery Connect; submit review manual di AGC.
      # continue-on-error: kegagalan upload tidak menggagalkan job;
      # notif dikirim step berikutnya.
      - name: Upload draft ke Huawei AppGallery
        id: huawei-upload
        continue-on-error: true
        env:
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          AAB_PATH: ${{ steps.artifact.outputs.aab_path }}
        run: node scripts/upload-huawei-appgallery.mjs "$AAB_PATH"

      - name: Kirim notif gagal upload Huawei ke Telegram
        if: steps.huawei-upload.outcome == 'failure'
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            GAGAL Upload AAB ke Huawei AppGallery - sambasku/mobile Deploy (Huawei)
            Tag: ${{ steps.tag.outputs.tag }} · Commit: ${{ github.sha }}
            Sumber AAB: Deploy (Production) run ${{ steps.artifact.outputs.run_id }}
            Cek log step / versi terkunci di AppGallery Connect.
            https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}

      - name: Kirim notif gagal upload Huawei ke Discord
        if: steps.huawei-upload.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
          PROD_RUN: ${{ steps.artifact.outputs.run_id }}
          RUN_URL: "https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="GAGAL Upload AAB ke Huawei AppGallery - sambasku/mobile Deploy (Huawei)
          Tag: $TAG · Commit: $SHA
          Sumber AAB: Deploy (Production) run $PROD_RUN
          Cek log step / versi terkunci di AppGallery Connect.
          $RUN_URL"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"

  notify:
    needs: [huawei]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && 'GAGAL' || (contains(needs.*.result, 'cancelled') && 'Dibatalkan' || 'Sukses') }} CI sambasku/mobile - Deploy (Huawei AppGallery)
            Tag: ${{ inputs.tag || github.ref_name }} · Run oleh: ${{ github.actor }}
            https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && 'GAGAL' || (contains(needs.*.result, 'cancelled') && 'Dibatalkan' || 'Sukses') }}"
          TAG: "${{ inputs.tag || github.ref_name }}"
          ACTOR: ${{ github.actor }}
          RUN_URL: "https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI sambasku/mobile - Deploy (Huawei AppGallery)
          Tag: $TAG · Run oleh: $ACTOR
          $RUN_URL"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
