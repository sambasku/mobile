name: Deploy (Huawei AppGallery)

# Pipeline khusus Huawei AppGallery, terpisah dari Deploy (Production).
# Trigger manual: Actions -> Deploy (Huawei AppGallery) -> Run workflow.
# Input tag kosong = pakai tag vMAJOR.MINOR.PATCH terbaru; isi tag lama
# (mis. v1.2.3) untuk deploy ulang versi tertentu. Review Huawei lambat,
# jadi rilis Huawei tidak harus serentak dengan Play.
#
# versionCode = MAJOR*10000 + MINOR*100 + PATCH (deterministik dari tag,
# selalu naik antar release, tidak perlu query API). Contoh v1.2.3 -> 10203.
# versionName = tag tanpa awalan v.
#
# Secrets GitHub (sama dengan deploy-production.yml):
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   HUAWEI_CLIENT_ID / HUAWEI_CLIENT_SECRET / HUAWEI_APP_ID
# Kosong = script upload skip dengan exit 0 (workflow tetap hijau).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag yang di-deploy (mis. v1.2.3). Kosong = tag terbaru."
        required: false
        type: string

permissions:
  contents: read

env:
  FLAVOR: production
  FLUTTER_VERSION: "3.44.1"

jobs:
  huawei:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: huawei-appgallery
      cancel-in-progress: false
    steps:
      - name: Checkout (default branch + semua tag)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag (input kosong = tag terbaru)
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git tag --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag tidak ditemukan / tidak valid: '$TAG' (pola vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          git checkout "$TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploy Huawei dari tag: ${TAG}"

      - name: Test Huawei AppGallery uploader
        run: node --test scripts/upload-huawei-appgallery.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Resolve version (dari tag, deterministik)
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NAME="${TAG#v}"
          MAJOR=$(printf '%s' "$NAME" | cut -d. -f1)
          MINOR=$(printf '%s' "$NAME" | cut -d. -f2)
          PATCH=$(printf '%s' "$NAME" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}"    >> "$GITHUB_OUTPUT"
          echo "Versi Huawei: ${NAME}+${CODE}"

      - name: Write resolved version into pubspec.yaml
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i "s|^version:.*|version: ${VERSION_NAME}+${VERSION_CODE}|" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: >
          flutter build appbundle --release --obfuscate
          --split-debug-info=./debug-info
          --flavor "$FLAVOR" -t lib/main.dart

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: huawei-aab-${{ steps.version.outputs.name }}
          path: build/app/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error

      - name: Assert AAB has no advertising ID permission
        run: node scripts/assert-no-ad-id.mjs

      # Draft di AppGallery Connect; submit review manual di AGC
      # (kebijakan sama dengan Play: draft + rollout manual).
      # continue-on-error: kegagalan upload Huawei tidak menggagalkan job,
      # notif dikirim step berikutnya.
      - name: Upload draft ke Huawei AppGallery
        id: huawei-upload
        continue-on-error: true
        env:
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        run: node scripts/upload-huawei-appgallery.mjs
          build/app/outputs/bundle/productionRelease/app-production-release.aab

      - name: Kirim notif gagal upload Huawei ke Telegram
        if: steps.huawei-upload.outcome == 'failure'
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            GAGAL Upload AAB ke Huawei AppGallery — sambasku/mobile Deploy (Huawei)
            Tag: ${{ steps.tag.outputs.tag }} · Commit: ${{ github.sha }}
            Cek log step / versi terkunci di AppGallery Connect.
            https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}

      - name: Kirim notif gagal upload Huawei ke Discord
        if: steps.huawei-upload.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="GAGAL Upload AAB ke Huawei AppGallery — sambasku/mobile Deploy (Huawei)
          Tag: $TAG · Commit: $SHA
          Cek log step / versi terkunci di AppGallery Connect.
          $RUN_URL"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"

  notify:
    needs: [huawei]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && 'GAGAL' || (contains(needs.*.result, 'cancelled') && 'Dibatalkan' || 'Sukses') }} CI sambasku/mobile — Deploy (Huawei AppGallery)
            Tag: ${{ inputs.tag || 'terbaru' }} · Run oleh: ${{ github.actor }}
            https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && 'GAGAL' || (contains(needs.*.result, 'cancelled') && 'Dibatalkan' || 'Sukses') }}"
          TAG: "${{ inputs.tag || 'terbaru' }}"
          ACTOR: ${{ github.actor }}
          RUN_URL: "https://github.com/sambasku/mobile/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI sambasku/mobile — Deploy (Huawei AppGallery)
          Tag: $TAG · Run oleh: $ACTOR
          $RUN_URL"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
